name: setup-blender
description: Download a pinned Linux x64 Blender from download.blender.org, verify its SHA-256, cache it and add it to PATH
inputs:
  version:
    description: Full Blender version, for example 5.0.1
    required: true
  sha256:
    description: SHA-256 of blender-<version>-linux-x64.tar.xz from the .sha256 file next to it on download.blender.org
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/blender-cache/*.tar.xz.*
        key: blender-archive-linux-x64-${{ inputs.version }}-${{ inputs.sha256 }}
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        : "${SHA256:?A pinned Blender SHA-256 is required}"
        export BLENDER_USER_RESOURCES="$(mktemp -d "$RUNNER_TEMP/blender-profile.XXXXXX")"
        mkdir -p "$BLENDER_USER_RESOURCES"
        echo "BLENDER_USER_RESOURCES=$BLENDER_USER_RESOURCES" >> "$GITHUB_ENV"
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
        BINARY="$(python3 tools/fetch_blender.py --version "$VERSION" --sha256 "$SHA256" --cache "$HOME/blender-cache")"
        echo "$(dirname "$BINARY")" >> "$GITHUB_PATH"
        "$BINARY" --version
