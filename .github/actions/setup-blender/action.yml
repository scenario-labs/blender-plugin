name: setup-blender
description: Download a pinned Linux x64 Blender from download.blender.org, verify its SHA-256, cache it and add it to PATH
inputs:
  version:
    description: Full Blender version, for example 5.0.1
    required: true
  sha256:
    description: SHA-256 of blender-<version>-linux-x64.tar.xz from the .sha256 file next to it on download.blender.org
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/blender/${{ inputs.version }}
        key: blender-linux-x64-${{ inputs.version }}-${{ inputs.sha256 }}
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        export BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile"
        mkdir -p "$BLENDER_USER_RESOURCES"
        echo "BLENDER_USER_RESOURCES=$BLENDER_USER_RESOURCES" >> "$GITHUB_ENV"
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
        DEST="$HOME/blender/$VERSION"
        if [ ! -x "$DEST/blender" ]; then
          SERIES="${VERSION%.*}"
          curl -fsSL -o "$RUNNER_TEMP/blender.tar.xz" "https://download.blender.org/release/Blender${SERIES}/blender-${VERSION}-linux-x64.tar.xz"
          echo "${SHA256}  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          mkdir -p "$DEST"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$DEST" --strip-components=1
        fi
        echo "$DEST" >> "$GITHUB_PATH"
        "$DEST/blender" --version
