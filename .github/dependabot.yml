version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after an action release before proposing it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "area:ci"]
    commit-message:
      prefix: "ci(deps)"
  # Node tooling for CI and contributors (commitlint, TypeScript), not the extension.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      node:
        patterns: ["*"]
    ignore:
      # Node's types follow the Node major in .nvmrc; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "area:tooling"]
    commit-message:
      prefix: "chore(deps)"
