name: Agent skills

on:
  workflow_call:

permissions:
  contents: read

jobs:
  agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          cache-dependency-glob: scripts/agents/validate-skills.py
      - run: uv run --no-project --python 3.12 scripts/agents/validate-skills.py
      - run: uv run --no-project --python 3.12 scripts/agents/validate-skills.py --test
