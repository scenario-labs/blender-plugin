name: Blender baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  blender:
    name: blender-baseline (${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.0.1"
            sha256: "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09"
          - version: "5.1.2"
            sha256: "aaccb355f50183979b698bcce7467103a76261b5fa59f4972295842662a285fb"
          - version: "5.2.3"
            sha256: "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ matrix.version }}
          sha256: ${{ matrix.sha256 }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: uv sync --locked
      - name: Test the exact ZIP in a new profile
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: uv run --locked --no-env-file python tools/test_blender.py --expected-version "$BLENDER_VERSION" --artifacts "$RUNNER_TEMP/scenario-tests"
      - name: Test native extension install and update on loopback
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: uv run --locked --no-env-file python tools/test_repository_update.py --expected-version "$BLENDER_VERSION" --artifacts "$RUNNER_TEMP/scenario-update-tests"
      - name: Test Scenario package state across native update and restart
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=("$RUNNER_TEMP"/scenario-tests/run-*/*.zip)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one tested candidate ZIP" >&2
            exit 1
          fi
          uv run --locked --no-env-file python tools/test_repository_update.py \
            --expected-version "$BLENDER_VERSION" --candidate-zip "${candidates[0]}" \
            --test-predecessor --artifacts "$RUNNER_TEMP/scenario-package-update-tests"
      - name: Install virtual display for offline GUI captures
        run: sudo apt-get install -y --no-install-recommends xvfb xauth openbox libgl1-mesa-dri xdotool imagemagick
      - name: Capture the tested ZIP in both UI views
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=("$RUNNER_TEMP"/scenario-tests/run-*/*.zip)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one tested candidate ZIP" >&2
            exit 1
          fi
          for view in sidebar composer; do
            display_logs="$RUNNER_TEMP/scenario-screenshots/display-$view"
            mkdir -p "$display_logs"
            xvfb-run -a -e "$display_logs/xvfb.log" -s '-screen 0 1920x1080x24' \
              bash -euc '
                openbox_log=$1
                shift
                openbox --sm-disable >"$openbox_log" 2>&1 &
                window_manager_pid=$!
                cleanup() { kill "$window_manager_pid" 2>/dev/null || true; }
                trap cleanup EXIT
                uv run --locked --no-env-file python tools/capture_gui.py "$@"
              ' capture "$display_logs/openbox.log" \
              --zip "${candidates[0]}" --view "$view" --fixture form --gpu-backend opengl --capture-backend x11 \
              --output "$RUNNER_TEMP/scenario-screenshots" --label "$GITHUB_SHA"
          done
      - name: Preserve plugin screenshots and capture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blender-screenshots-${{ matrix.version }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/scenario-screenshots/*/plugin.png
            ${{ runner.temp }}/scenario-screenshots/*/mcp-*.png
            ${{ runner.temp }}/scenario-screenshots/*/preferences-*.png
            ${{ runner.temp }}/scenario-screenshots/*/permissions.png
            ${{ runner.temp }}/scenario-screenshots/*/report.json
            ${{ runner.temp }}/scenario-screenshots/*/gui.json
            ${{ runner.temp }}/scenario-screenshots/*/*.log
      - name: Preserve ZIP, reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blender-baseline-${{ matrix.version }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/scenario-tests/*/*.log
            ${{ runner.temp }}/scenario-tests/*/result.json
            ${{ runner.temp }}/scenario-tests/*/tests.json
            ${{ runner.temp }}/scenario-tests/*/*.zip
            ${{ runner.temp }}/scenario-update-tests/*/*.log
            ${{ runner.temp }}/scenario-update-tests/*/result.json
            ${{ runner.temp }}/scenario-update-tests/*/update.json
            ${{ runner.temp }}/scenario-update-tests/*/first/*.zip
            ${{ runner.temp }}/scenario-update-tests/*/second/*.zip
            ${{ runner.temp }}/scenario-update-tests/*/repository-*/index.json
            ${{ runner.temp }}/scenario-package-update-tests/*/*.log
            ${{ runner.temp }}/scenario-package-update-tests/*/result.json
            ${{ runner.temp }}/scenario-package-update-tests/*/update.json
            ${{ runner.temp }}/scenario-package-update-tests/*/restart.json
            ${{ runner.temp }}/scenario-package-update-tests/*/first/*.zip
            ${{ runner.temp }}/scenario-package-update-tests/*/second/*.zip
            ${{ runner.temp }}/scenario-package-update-tests/*/repository-*/index.json

  blender-windows:
    name: blender-baseline (Windows, ${{ matrix.version }})
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.0.1"
            sha256: "921d77f6c505a35b2c2f6e67d4ad1c10b72418338ba0e0d3ea7f582a5e5fe46e"
          - version: "5.1.2"
            sha256: "345bedea7b0acf7cc9666423d8553f9129622aea34ded65c23e8cb70f83f14ff"
          - version: "5.2.3"
            sha256: "723f08a4401502561eb763cdeacf8745b31e5f3f154d287d3830d97cf75dc2fb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: uv sync --locked
      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ matrix.version }}
          sha256: ${{ matrix.sha256 }}
      - name: Test the exact ZIP in a new Windows profile
        shell: pwsh
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          uv run --locked --no-env-file python tools/test_blender.py --expected-version $env:BLENDER_VERSION --artifacts "$env:RUNNER_TEMP/scenario-tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native extension install and update on Windows loopback
        shell: pwsh
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          uv run --locked --no-env-file python tools/test_repository_update.py --expected-version $env:BLENDER_VERSION --artifacts "$env:RUNNER_TEMP/scenario-update-tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Scenario package state across Windows update and restart
        shell: pwsh
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          $candidates = @(Get-ChildItem -Path "$env:RUNNER_TEMP/scenario-tests/run-*/*.zip" -File)
          if ($candidates.Count -ne 1) { throw "Expected exactly one tested candidate ZIP" }
          uv run --locked --no-env-file python tools/test_repository_update.py --expected-version $env:BLENDER_VERSION --candidate-zip $candidates[0].FullName --test-predecessor --artifacts "$env:RUNNER_TEMP/scenario-package-update-tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows ZIP, reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blender-baseline-windows-${{ matrix.version }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/scenario-tests/*/*.log
            ${{ runner.temp }}/scenario-tests/*/result.json
            ${{ runner.temp }}/scenario-tests/*/tests.json
            ${{ runner.temp }}/scenario-tests/*/*.zip
            ${{ runner.temp }}/scenario-update-tests/*/*.log
            ${{ runner.temp }}/scenario-update-tests/*/result.json
            ${{ runner.temp }}/scenario-update-tests/*/update.json
            ${{ runner.temp }}/scenario-update-tests/*/first/*.zip
            ${{ runner.temp }}/scenario-update-tests/*/second/*.zip
            ${{ runner.temp }}/scenario-update-tests/*/repository-*/index.json
            ${{ runner.temp }}/scenario-package-update-tests/*/*.log
            ${{ runner.temp }}/scenario-package-update-tests/*/result.json
            ${{ runner.temp }}/scenario-package-update-tests/*/update.json
            ${{ runner.temp }}/scenario-package-update-tests/*/restart.json
            ${{ runner.temp }}/scenario-package-update-tests/*/first/*.zip
            ${{ runner.temp }}/scenario-package-update-tests/*/second/*.zip
            ${{ runner.temp }}/scenario-package-update-tests/*/repository-*/index.json

  blender-baseline-ok:
    if: always()
    needs: [blender, blender-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every baseline matrix leg
        env:
          MATRIX_RESULT: ${{ needs.blender.result }}
          WINDOWS_RESULT: ${{ needs.blender-windows.result }}
        run: test "$MATRIX_RESULT" = success && test "$WINDOWS_RESULT" = success
