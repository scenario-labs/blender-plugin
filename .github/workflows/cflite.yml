# Coverage-guided Atheris fuzzing of every tests/fuzz harness with ClusterFuzzLite,
# weekly or on demand; pull requests run the same harnesses through pytest instead.
# The actions clone the repository themselves with the read-only workflow token, so
# there is no checkout step, and keep corpora and crash reproducers as artifacts.
name: ClusterFuzzLite

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  # Download earlier corpora and coverage, which ClusterFuzzLite keeps as workflow artifacts.
  actions: read

concurrency:
  group: cflite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  batch:
    name: clusterfuzzlite-batch
    runs-on: ubuntu-24.04
    # Each harness first pages through every repository artifact for its corpus, a
    # few minutes per harness on top of the build and the hour of fuzzing.
    timeout-minutes: 150
    steps:
      - name: Build the harnesses
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ github.token }}
      - name: Fuzz every harness
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          mode: batch
          fuzz-seconds: 3600
          github-token: ${{ github.token }}
