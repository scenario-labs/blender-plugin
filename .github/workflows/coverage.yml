name: Coverage

# Pull request workflows stay read-only, so coverage uploads from pushes: main and
# same-repository branches with an open pull request. Fork branches never push
# here; GitHub compares a pull request against main's last upload.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/unit-tests.yml

  # Both legs count: a line that only one Python version runs is still covered.
  combine:
    name: combine-coverage
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-coverage-*
          path: legs
      - name: Combine the 3.11 and 3.13 coverage data
        run: |
          uv run --locked --no-env-file coverage combine \
            legs/unit-coverage-3.11/.coverage legs/unit-coverage-3.13/.coverage
          uv run --locked --no-env-file coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-combined
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  # A job of its own so code-quality: write never reaches the test code.
  upload:
    name: upload-coverage
    needs: combine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      code-quality: write
      # Finds the open pull request for a branch push.
      pull-requests: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-combined
          path: coverage
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/coverage.xml
          language: Python
          label: code-coverage/python
