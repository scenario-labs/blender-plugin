name: Repository knowledge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
      - name: Check knowledge and publish report
        shell: bash
        run: |
          set -o pipefail
          uv run --locked --no-env-file python tools/check_knowledge.py | tee knowledge-report.txt
      - name: Summarize structure and freshness
        if: always()
        shell: bash
        run: |
          if test -f knowledge-report.txt; then
            {
              echo '### Repository knowledge'
              echo '```text'
              cat knowledge-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Exercise checker regressions
        run: uv run --locked --no-env-file python -m pytest tests/unit/test_knowledge.py
