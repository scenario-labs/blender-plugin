# Reporting permission belongs only to this schedule/manual caller, never PRs.
name: links-scheduled

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-scheduled
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'scenario-labs/blender-plugin'
    uses: ./.github/workflows/links.yml
  report:
    name: report-link-failure
    needs: scan
    if: ${{ !cancelled() && github.repository == 'scenario-labs/blender-plugin' && (needs.scan.result != 'success' || needs.scan.outputs.exit_code != '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Download the report when available
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: links-report
          path: workdir/link-check/
      - name: Create or update the link tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --no-project --no-env-file python -m tools.report_link_failure \
            --repository "$GITHUB_REPOSITORY" --run-url "$RUN_URL" \
            --report workdir/link-check/report.md
