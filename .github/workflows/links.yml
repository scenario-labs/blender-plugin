# External sites are advisory and stay outside ci-ok and required checks.
name: links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/links*.yml"
      - "tools/link_inventory.py"
  workflow_call:
    outputs:
      exit_code:
        description: Lychee exit code, empty if scanning did not complete
        value: ${{ jobs.scan.outputs.exit_code }}

permissions:
  contents: read

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: links
    if: github.repository == 'scenario-labs/blender-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Select repository Markdown inputs
        run: uv run --no-project --no-env-file python tools/link_inventory.py --output workdir/link-check/inputs.txt
      - name: Check links without following redirects
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose --no-progress --max-redirects 0 --exclude-loopback
            --files-from workdir/link-check/inputs.txt
          output: workdir/link-check/report.md
          fail: ${{ github.event_name == 'pull_request' }}
      - name: Retain the link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: links-report
          path: workdir/link-check/
          retention-days: 14
          if-no-files-found: warn
