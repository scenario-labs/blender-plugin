name: MCP tool report

# Measures with pull request code under read-only permissions; the MCP tool
# comment workflow posts the result from the default branch.
on:
  pull_request:
    paths:
      - "scenario/**"
      - "tools/gen_mcp_docs.py"
      - "tools/mcp_tool_sizes.py"
      - ".github/workflows/mcp-tool-report.yml"

permissions:
  contents: read

concurrency:
  group: mcp-tool-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
          enable-cache: true
      - name: Measure tools/list against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          mkdir -p mcp-tool-report
          uv run --locked --no-env-file python tools/mcp_tool_sizes.py \
            --base-root "$RUNNER_TEMP/base" --base-ref "$BASE_SHA" > mcp-tool-report/report.json
          {
            echo '### MCP tool definitions'
            echo '```json'
            cat mcp-tool-report/report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-tool-report
          path: mcp-tool-report/report.json
          if-no-files-found: error
          # A re-run keeps the run ID; replace the earlier attempt's report.
          overwrite: true
