name: publish-changelog

# Posts a GitHub release's notes to the public changelog at
# www.scenario.com/changelog.
#
# This lives off the `release: published` event rather than inside
# release-please.yml so a failed POST stays recoverable: a failure fails this
# job visibly, "Re-run jobs" retries it, and workflow_dispatch republishes any
# tag by hand. The ingest endpoint skips versions it already holds, so a rerun
# never duplicates an entry.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example blender-plugin-v0.9.10"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-changelog-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    # Forks hold neither the ingest secret nor the releases this reads.
    if: github.repository == 'scenario-labs/blender-plugin'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release notes to www.scenario.com
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          CHANGELOG_INGEST_SECRET: ${{ secrets.CHANGELOG_INGEST_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CHANGELOG_INGEST_SECRET:-}" ]; then
            echo "::error::CHANGELOG_INGEST_SECRET is not set for this repository"
            exit 1
          fi

          body="$(mktemp)"
          payload="$(mktemp)"
          gh release view "$TAG" --json body --jq .body > "$body"

          # release-please-config.json hides docs, chore, ci, test, refactor,
          # build and style, and release-please cuts no release from those
          # alone. A release created or edited by hand can still carry a body
          # with no "### " section; posting it would create an empty public
          # entry or fail on the endpoint's header check for nothing.
          if ! grep -q '^### ' "$body"; then
            echo "::notice::$TAG has no user-facing sections, nothing to publish"
            exit 0
          fi

          jq -Rs --arg repo blender-plugin '{repo: $repo, changelog: .}' < "$body" > "$payload"

          # The bearer token is fed to curl on stdin via --config. Passing it as
          # a -H argument would put it in this process's argv, where anything
          # else on the runner can read it out of /proc/*/cmdline.
          printf 'header = "Authorization: Bearer %s"\n' "$CHANGELOG_INGEST_SECRET" \
            | curl --config - \
              --silent --show-error --location --fail-with-body \
              --max-time 30 --retry 5 --retry-all-errors \
              --request POST https://www.scenario.com/api/changelog/ingest \
              --header "Content-Type: application/json" \
              --data-binary "@$payload"

          echo "Published $TAG to www.scenario.com/changelog"
