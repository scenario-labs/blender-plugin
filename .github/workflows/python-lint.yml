name: Python lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml
          enable-cache: true
      - name: Sync the locked development environment
        run: uv sync --locked
      - name: Check every Python file
        # The whole tree is Ruff-clean since #28; keep it that way.
        run: make lint
      - name: Check licence metadata for every file
        # REUSE.toml covers files that cannot carry an SPDX header.
        run: make lint-licence
