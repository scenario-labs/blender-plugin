name: SDK contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: uv sync --locked
      - name: Verify SDK contracts without network requests
        run: uv run --locked python -m pytest tests/unit/test_scenario_sdk_contract.py -rx
