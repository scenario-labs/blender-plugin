name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            version: "3.11.13"
          - python: "3.13"
            version: "3.13.11"
    env:
      PYTHON_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv version
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - name: Sync the locked development environment
        run: uv sync --locked --python "$PYTHON_VERSION"
      - name: Run every offline unit test
        id: tests
        run: |
          uv run --locked --no-env-file --python "$PYTHON_VERSION" python -m pytest tests/unit -rx \
            --cov --cov-report=term --cov-report=xml --cov-report=html \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"
      - name: Retain unit coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14
