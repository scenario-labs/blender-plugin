name: Unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            version: "3.11.13"
          - python: "3.13"
            version: "3.13.11"
    env:
      PYTHON_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - name: Sync the locked development environment
        run: uv sync --locked --python "$PYTHON_VERSION"
      - name: Run every offline unit test
        id: tests
        run: |
          uv run --locked --no-env-file --python "$PYTHON_VERSION" python -m pytest tests/unit tests/fuzz -rx \
            --cov --cov-report=term --cov-report=xml --cov-report=html \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"
      - name: Retain unit coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-${{ matrix.python }}
          # .coverage is the raw data the Coverage workflow combines across legs.
          path: |
            .coverage
            coverage.xml
            htmlcov/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
