# Optional: install explicitly with make hooks. All tools use the locked uv dev group.
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: no-commit-to-branch
        name: prevent direct commits to main
        entry: uv run --locked --no-env-file no-commit-to-branch --branch main
        language: system
        pass_filenames: false
        always_run: true
      - id: check-added-large-files
        name: check added large files
        entry: uv run --locked --no-env-file check-added-large-files --maxkb=1024
        language: system
      - id: check-merge-conflict
        name: check merge conflict markers
        entry: uv run --locked --no-env-file check-merge-conflict
        language: system
        types: [text]
      - id: check-toml
        name: check TOML
        entry: uv run --locked --no-env-file check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: check YAML
        entry: uv run --locked --no-env-file check-yaml
        language: system
        types: [yaml]
      - id: detect-private-key
        name: detect private keys
        entry: uv run --locked --no-env-file detect-private-key
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix final newlines
        entry: uv run --locked --no-env-file end-of-file-fixer
        language: system
        types: [text]
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --locked --no-env-file trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
        exclude: ^tests/fixtures/
      - id: ruff-check
        name: Ruff check changed Python files
        entry: uv run --locked --no-env-file ruff check --
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format changed Python files
        entry: uv run --locked --no-env-file ruff format --
        language: system
        types_or: [python, pyi]
      - id: check-secrets
        name: check staged secrets and forbidden files
        entry: uv run --locked --no-env-file python tools/check_secrets.py --
        language: system
        types: []
      - id: house-rules
        name: check house rules
        entry: uv run --locked --no-env-file python tools/check_rules.py --
        language: system
        types: []
      - id: conventional-pre-commit
        name: check Conventional Commit type
        entry: uv run --locked --no-env-file conventional-pre-commit
        language: system
        stages: [commit-msg]
        always_run: true
        args: [--verbose, feat, fix, docs, chore, ci, build, perf, refactor, revert, style, test]
