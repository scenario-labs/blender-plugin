# Shared pacing for CI and local scans. Status and redirect checks stay strict.
host_concurrency = 2
host_request_interval = "500ms"
retry_wait_time = 5

# GNU.org still returns 429 with the default pacing. Serialize and slow its checks.
[hosts."www.gnu.org"]
concurrency = 1
request_interval = "10s"
