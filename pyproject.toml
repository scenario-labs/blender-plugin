[tool.ruff]
required-version = "==0.16.7"
# Blender v5.0.1 build_files/build_environment/cmake/versions.cmake: Python 3.11.13.
target-version = "py311"
line-length = 100
unsafe-fixes = false
# Retired snapshots are removed separately; never reformat installed packages.
extend-exclude = ["archive", "versions", ".blender-profile"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# These standalone entry points establish the repository import path first.
"tests/smoke/*.py" = ["E402"]
"tools/audit_payloads.py" = ["E402"]
"tools/record_fixtures.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["scenario", "scenario_studio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
